name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: heygalaxy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Find and upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HeyGalaxy-debug
          path: |
            heygalaxy/app/build/outputs/apk/debug/*.apk
            heygalaxy/app/build/outputs/apk/debug/**/*.apk
          retention-days: 30
          if-no-files-found: verbose
